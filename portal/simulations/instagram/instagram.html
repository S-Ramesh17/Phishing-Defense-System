<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Instagram Training</title><link rel="stylesheet" href="../instagram.css" /></head><body>
<div style="max-width:420px;margin:40px auto;padding:20px;border:1px solid #ddd;border-radius:8px;font-family:Arial, sans-serif;">
  <h2>Instagram - Training Page</h2>
  <p>This is a <strong>training</strong> page to practise spotting phishing. Do NOT enter real credentials.</p>
  <form id="loginForm">
    <label>Email or phone<br/><input type="text" name="user" placeholder="Email or phone" /></label><br/><br/>
    <label>Password<br/><input type="password" name="pass" placeholder="Password" /></label><br/><br/>
    <button type="submit">Log In</button>
  </form>
  <div id="msg"></div>
</div>
<script src="login-handler.js"></script>
</body></html>
